name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage grammars
        run: |
          ./tools/ast/setup_grammars.sh

      - name: Build static axiom-initd binary via Alpine musl
        run: |
          docker run --rm -v "${{ github.workspace }}":/src -w /src alpine:3.21 sh -c \
            "apk update && apk add --no-cache build-base clang llvm cmake ninja musl-dev linux-headers file busybox-static tree-sitter-dev tree-sitter-static git bash && \
             cmake -B build-musl -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DAXIOM_STATIC_BUILD=ON -DAXIOM_BUILD_TESTS=OFF -DAXIOM_WARNINGS_AS_ERRORS=ON && \
             cmake --build build-musl --target axiom-initd && \
             file build-musl/bin/axiom-initd | grep -i 'statically linked' && \
             mkdir -p dist-release && \
             cp build-musl/bin/axiom-initd dist-release/axiom-initd"

      - name: Build Python distribution packages
        run: |
          pip install build
          python -m build
          mkdir -p dist-release
          cp dist/* dist-release/

      - name: Build TypeScript SDK package
        working-directory: sdk/typescript
        run: |
          npm install
          npm run prepublishOnly
          npm pack
          cp *.tgz ../../dist-release/

      - name: Package appliance kernel
        run: |
          if [ -f tools/kernel/vmlinux ]; then
            cp tools/kernel/vmlinux dist-release/vmlinux
          fi

      - name: Generate SHA256 checksums
        working-directory: dist-release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
